# 项目关卡 —— deepseek
# 约定：字段为空 = 未通过。不允许「大概过了」。
# 两道硬关卡由秘书在对话里贴出证据后才算数（证据 = 跑过的命令与输出）。

project: deepseek
updated: 2026-09-19

gates:

  # ── 软关卡：自由往返，但需要留痕 ──
  1_to_2:
    desc: 一句话说清「做成什么样算成功」，并说得出不做什么
    success_statement: ""
    non_goals: []
    passed: false

  # ── 硬关卡一：未过此关，不许进入阶段 3（动手做） ──
  2_to_3:
    desc: 规格已落盘；任务清单每项有负责人、验收标准、依赖边
    spec_file: ""              # 例：docs/superpowers/specs/2026-09-19-xxx-design.md
    tasks: []                  # 例：- id: t1 / subject: ... / assignee: 工程部 / deps: []
    require:
      - spec_file 非空，且该文件真的存在
      - tasks 非空，且每项都有 assignee 与验收标准
      - 没有 TBD / 待定
    passed: false

  # ── 软关卡：自由往返，但需要留痕 ──
  3_to_4:
    desc: 实现完成；测试先红后绿；改动最小
    changed_files: []
    passed: false

  # ── 硬关卡二：未过此关，不许宣布完成 ──
  4_to_5:
    desc: 验证命令跑过并贴出输出；独立评审通过
    verify_evidence: []        # 例：- cmd: node --test / exit: 0 / out: "12 passed"
    reviewer: ""               # 评审部门（应为质检部，不能是生产者）
    reviewer_report: ""        # 质检报告原文路径 —— 空 = 未通过
    require:
      - verify_evidence 非空
      - reviewer_report 非空，且该文件真的存在
      - reviewer 不等于生产者
    passed: false

  # ── 收尾 ──
  5_done:
    desc: 交接文档落地；产物处置明确
    handoff_doc: ""
    artifacts_disposition: ""
    passed: false

loop:
  # 阶段 4 失败 -> 回阶段 3。同一条回路最多 3 次
  stage4_failures_to_stage3: 0
  max: 3
  note: 第 3 次仍未通过 -> 停下问用户，不许自己宣布通过
