<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>论文阅读台</title>
<style>
  :root{
    --bg:#1b1d21; --panel:#24272c; --line:#34383f; --fg:#e8eaed;
    --dim:#9aa0a6; --accent:#4c8bf5; --ok:#34a853; --warn:#fbbc04; --err:#ea4335;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.65 "Microsoft YaHei",system-ui,sans-serif;
       display:flex;flex-direction:column}
  header{padding:9px 14px;border-bottom:1px solid var(--line);
         display:flex;gap:14px;align-items:center;flex:0 0 auto}
  header b{color:var(--accent)}
  header .dir{color:var(--dim);font-size:12px}
  main{flex:1;display:flex;min-height:0}

  /* 左栏 */
  #papers{width:270px;flex:0 0 auto;border-right:1px solid var(--line);
          overflow:auto;padding:8px}
  .paper{padding:8px 10px;border-radius:6px;cursor:pointer;margin-bottom:4px;
         border:1px solid transparent}
  .paper:hover{background:#2c3036}
  .paper.on{background:#2c3036;border-color:var(--accent)}
  .paper .n{font-size:12.5px;line-height:1.4;word-break:break-all}
  .paper .m{color:var(--dim);font-size:11px;margin-top:2px}

  /* 中栏 */
  #viewer{flex:1;display:flex;flex-direction:column;align-items:center;
          min-width:0;padding:10px;overflow:auto}
  #pageimg{max-width:100%;border:1px solid var(--line);background:#fff;
           border-radius:4px}
  #nav{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap;
       justify-content:center}
  button{background:#2f333a;color:var(--fg);border:1px solid var(--line);
         border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer}
  button:hover:not(:disabled){background:#3a3f47}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover:not(:disabled){background:#3d7ae0}
  #figs{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  #figs .fig{font-size:12px}

  /* 右栏 */
  #side{width:470px;flex:0 0 auto;border-left:1px solid var(--line);
        display:flex;flex-direction:column;min-height:0}
  #sidehead{padding:10px;border-bottom:1px solid var(--line);
            display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  select{background:#2f333a;color:var(--fg);border:1px solid var(--line);
         border-radius:6px;padding:6px;font:inherit;max-width:100%}
  #out{flex:1;overflow:auto;padding:14px;white-space:pre-wrap;
       word-break:break-word;font-size:13.5px}
  #out h2{font-size:14px;color:var(--accent);margin:14px 0 4px}
  #out .meta{color:var(--dim);font-size:11.5px;margin-bottom:10px}
  #out .err{color:var(--err)}
  #textbox{flex:0 0 auto;max-height:34%;overflow:auto;border-top:1px solid var(--line);
           padding:10px 14px;color:var(--dim);font-size:12px;white-space:pre-wrap}
  details summary{cursor:pointer;color:var(--dim);font-size:12px;margin-bottom:6px}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--dim);
        border-top-color:transparent;border-radius:50%;animation:r .8s linear infinite;
        vertical-align:-2px;margin-right:6px}
  @keyframes r{to{transform:rotate(360deg)}}
  .hint{color:var(--dim);font-size:12.5px}
</style>
</head>
<body>
<header>
  <b>论文阅读台</b>
  <span class="dir" id="root">加载中…</span>
</header>

<main>
  <div id="papers" class="col"><div class="hint" style="padding:8px">加载中…</div></div>

  <div id="viewer">
    <img id="pageimg" alt="" style="display:none">
    <div id="nav" style="display:none">
      <button id="prev">◀ 上一页</button>
      <span id="pageno" class="hint">-</span>
      <button id="next">下一页 ▶</button>
      <button id="zoomout">缩小</button>
      <button id="zoomin">放大</button>
    </div>
    <div id="figs"></div>
  </div>

  <div id="side">
    <div id="sidehead">
      <select id="model"></select>
      <button id="ask" class="primary" disabled>让 AI 读这一页</button>
    </div>
    <div id="out"><div class="hint">左侧选一篇论文 → 中间翻到想看的一页 → 点上面的按钮。</div></div>
    <div id="textbox"><details><summary>这一页的原始文字（pypdf 提取）</summary><div id="rawtext">—</div></details></div>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
let papers = [], cur = null, page = 0, total = 0, dpi = 110, figs = [];

async function api(path, opt) {
  const r = await fetch(path, opt);
  const ct = r.headers.get('content-type') || '';
  if (ct.includes('application/json')) {
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
    return j;
  }
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r;
}

async function boot() {
  try {
    const c = await api('/api/config');
    $('#root').textContent = c.root + '  ·  ' + (c.hasPypdf ? 'pypdf 已装' : 'pypdf 未装');
    $('#model').innerHTML = c.models.map(m =>
      `<option value="${m.id}" ${m.id === c.defaultModel ? 'selected' : ''}>${m.label}</option>`).join('');
    const p = await api('/api/papers');
    papers = p.papers;
    renderPapers();
  } catch (e) {
    $('#papers').innerHTML = '<div class="err" style="padding:8px">加载失败: ' + e.message + '</div>';
  }
}

function renderPapers() {
  if (!papers.length) {
    $('#papers').innerHTML = '<div class="hint" style="padding:8px">这个目录里没有 PDF</div>';
    return;
  }
  $('#papers').innerHTML = papers.map((p, i) =>
    `<div class="paper" data-i="${i}">
       <div class="n">${escapeHtml(p.name)}</div>
       <div class="m">${p.sizeKB.toLocaleString()} KB</div>
     </div>`).join('');
  document.querySelectorAll('.paper').forEach(el =>
    el.onclick = () => openPaper(+el.dataset.i));
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function openPaper(i) {
  cur = papers[i];
  document.querySelectorAll('.paper').forEach(el => el.classList.toggle('on', +el.dataset.i === i));
  const m = await api('/api/meta?path=' + encodeURIComponent(cur.path));
  total = m.pages;
  page = 0;
  $('#pageimg').style.display = '';
  $('#nav').style.display = 'flex';
  $('#ask').disabled = false;
  await showPage();
}

async function showPage() {
  if (!cur) return;
  $('#pageno').textContent = (page + 1) + ' / ' + total;
  $('#prev').disabled = page <= 0;
  $('#next').disabled = page >= total - 1;
  const q = 'path=' + encodeURIComponent(cur.path) + '&page=' + page;
  $('#pageimg').src = '/api/page.png?' + q + '&dpi=' + dpi;
  $('#rawtext').textContent = '加载中…';
  try {
    const t = await api('/api/text?' + q);
    $('#rawtext').textContent = t.text || '（这一页没提取到文字，可能是扫描件）';
  } catch (e) { $('#rawtext').textContent = '提取失败: ' + e.message; }
  try {
    const f = await api('/api/figures?' + q);
    figs = f.figures;
    $('#figs').innerHTML = figs.length
      ? '<span class="hint">这一页的图：</span>' + figs.map(f =>
          `<button class="fig" data-idx="${f.idx}">读第 ${f.idx + 1} 张</button>`).join('')
      : '<span class="hint">这一页没有内嵌图片</span>';
    document.querySelectorAll('#figs .fig').forEach(el =>
      el.onclick = () => askAI('figure', +el.dataset.idx));
  } catch (e) { $('#figs').innerHTML = ''; }
}

async function askAI(mode, idx) {
  if (!cur) return;
  const model = $('#model').value;
  const btn = mode === 'figure'
    ? document.querySelector(`#figs .fig[data-idx="${idx}"]`) : $('#ask');
  const old = btn.textContent;
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>读图中…（可能要 10 秒到 2 分钟）';
  $('#out').innerHTML = '<div class="meta">正在调用 ' + model + ' …</div>';
  try {
    const r = await api('/api/ai', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: cur.path, page, mode, idx, model })
    });
    const u = r.usage || {};
    $('#out').innerHTML =
      `<div class="meta">${r.model}  ·  耗时 ${r.seconds}s  ·  ` +
      `输入 ${u.prompt_tokens || '?'} / 输出 ${u.completion_tokens || '?'} tokens  ·  ` +
      `图片 ${r.imageKB} KB</div>` + md(r.text);
  } catch (e) {
    $('#out').innerHTML = '<div class="err">读图失败：' + escapeHtml(e.message) + '</div>';
  } finally {
    btn.disabled = false;
    btn.textContent = old;
  }
}

// 极简 markdown：## 标题 + 换行
function md(s) {
  return escapeHtml(s)
    .replace(/^##\s*(.+)$/gm, '<h2>$1</h2>')
    .replace(/^#\s*(.+)$/gm, '<h2>$1</h2>');
}

$('#prev').onclick = () => { if (page > 0) { page--; showPage(); } };
$('#next').onclick = () => { if (page < total - 1) { page++; showPage(); } };
$('#zoomin').onclick = () => { dpi = Math.min(300, dpi + 40); showPage(); };
$('#zoomout').onclick = () => { dpi = Math.max(60, dpi - 40); showPage(); };
$('#ask').onclick = () => askAI('page');
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowLeft') $('#prev').click();
  if (e.key === 'ArrowRight') $('#next').click();
});
boot();
</script>
</body>
</html>
